<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VARK — Desi Hip Hop / Rap. Music, original paintings and CDs." />
    <meta name="theme-color" content="#008080" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>VARK</title>
  </head>
  <body>
    <!--
      Netlify Forms: static copy of the React contact form so Netlify detects it at deploy time.
      Field names must match src/components/Contact.jsx.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
